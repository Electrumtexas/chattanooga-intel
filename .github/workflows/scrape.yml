name: Scrape and deploy

"on":
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC = 03:00/04:00 Central, after portals' overnight batch updates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      dashboard_changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # continue-on-error on every scrape step: quality_check.py (not a step
      # crashing early) is meant to be the thing that decides pass/fail — a
      # step left to fail hard here stops the whole job before quality_check
      # even runs, which would silently block OTHER sources' good data from
      # committing too. A step that fails still shows red in the Actions UI.
      - name: Scrape tax delinquent (Trustee direct download)
        working-directory: scraper
        run: python tax_delinquent.py
        continue-on-error: true

      - name: Scrape code enforcement (ArcGIS Hub CSV)
        working-directory: scraper
        run: python code_enforcement.py
        continue-on-error: true

      - name: Scrape Clerk & Master tax sale list
        working-directory: scraper
        run: python tax_sale.py
        continue-on-error: true

      - name: Scrape Chancery probate dockets
        working-directory: scraper
        run: python probate_dockets.py
        continue-on-error: true

      # Standing inventory of parcels whose county owner record is titled to
      # HEIRS / an ESTATE / an EXECUTOR (~254). Upserts its own parcels from the
      # county GIS, so it doesn't depend on enrich_assessor; runs after the
      # probate docket step so its probate cross-reference sees today's dockets.
      # ~9 requests, ~45 s; prints counts only.
      - name: Scrape estate-owned parcels (county GIS owner records)
        working-directory: scraper
        env:
          ESTATE_MAX_PAGES: "40"
        run: python estate_parcels.py
        continue-on-error: true

      # Six third-party posting sites, each mirroring a different law firm's
      # newspaper foreclosure notice (TN foreclosures require newspaper
      # publication, not a county filing, so no single site is a master
      # list — see the module docstring). Deliberately additive: one site
      # failing doesn't block the others.
      - name: Scrape foreclosure notices (posting sites)
        working-directory: scraper
        run: python foreclosure_notices.py
        continue-on-error: true

      # edockets.us answers US IPs only, so this step is the only place it can
      # be exercised — it can't be run from the dev machine's connection.
      - name: Scrape General Sessions dockets
        working-directory: scraper
        run: python sessions_dockets.py
        continue-on-error: true

      # Resolves addresses/points/owner names to parcels and backfills
      # lat/long + owner data from the county GIS. Runs after every source so
      # it sees the day's new rows, and before the quality check and export —
      # the dashboard map has nothing to plot without it.
      - name: Enrich parcels via county GIS
        working-directory: scraper
        env:
          ENRICH_MAX_PARCELS: "20000"
          ENRICH_MAX_ADDRESSES: "3000"
          ENRICH_MAX_POINTS: "5000"
          ENRICH_MAX_OWNER_LOOKUPS: "500"
        run: python enrich_assessor.py
        continue-on-error: true

      # City of Chattanooga tax portal (OpenGov): per-parcel municipal-lien
      # lookups for parcels ALREADY flagged by another source — enrichment
      # only, never a crawl. Reads parcels.tax_map_no, so it must run after
      # enrich_assessor. >=1.6 s between requests; caps keep it under ~10 min.
      - name: Enrich municipal liens (City tax portal)
        working-directory: scraper
        timeout-minutes: 15
        env:
          LIENS_MAX_PARCELS: "100"
          LIENS_MAX_SECONDS: "540"
          LIENS_MAX_YEARS_PER_PARCEL: "8"
        run: python municipal_liens.py
        continue-on-error: true

      - name: Quality check (fails the build before anything commits)
        working-directory: scraper
        run: python quality_check.py

      - name: Build unified leads + dashboard exports
        working-directory: scraper
        run: python build_unified.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/chattanooga.db dashboard/*.json
          if git diff --staged --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "Automated scrape $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # A manual dispatch (or the daily job overlapping a manual one) can
          # race an unrelated push to master — e.g. a source-code commit
          # landing while this run's scrapers were still working. Since this
          # step only ever touches data/chattanooga.db and dashboard/*.json,
          # rebasing onto whatever else landed is always safe (no other job
          # touches those paths), so retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — fetching and rebasing"
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::git push failed after 5 rebase-and-retry attempts"
          exit 1

  deploy:
    needs: scrape
    if: needs.scrape.outputs.dashboard_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/

      - id: deployment
        uses: actions/deploy-pages@v5
