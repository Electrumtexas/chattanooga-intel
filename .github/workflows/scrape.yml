name: Scrape and deploy

"on":
  schedule:
    - cron: "0 9 * * *"  # 09:00 UTC = 03:00/04:00 Central, after portals' overnight batch updates
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    # Same group as dev_skiptrace.yml: both can rewrite data/contacts.db.enc, and
    # two Fernet blobs from different checkouts cannot be merged by git (binary,
    # randomized ciphertext) - a stale one would silently drop paid contacts. The
    # group makes them take turns (a queued daily run just waits for a dev run;
    # GitHub keeps one running + one pending per group, which is enough here).
    concurrency:
      group: skiptrace-store
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scraper/requirements.txt

      # continue-on-error on every scrape step: quality_check.py (not a step
      # crashing early) is meant to be the thing that decides pass/fail — a
      # step left to fail hard here stops the whole job before quality_check
      # even runs, which would silently block OTHER sources' good data from
      # committing too. A step that fails still shows red in the Actions UI.
      - name: Scrape tax delinquent (Trustee direct download)
        working-directory: scraper
        run: python tax_delinquent.py
        continue-on-error: true

      - name: Scrape code enforcement (ArcGIS Hub CSV)
        working-directory: scraper
        run: python code_enforcement.py
        continue-on-error: true

      - name: Scrape Clerk & Master tax sale list
        working-directory: scraper
        run: python tax_sale.py
        continue-on-error: true

      - name: Scrape Chancery probate dockets
        working-directory: scraper
        run: python probate_dockets.py
        continue-on-error: true

      # Standing inventory of parcels whose county owner record is titled to
      # HEIRS / an ESTATE / an EXECUTOR (~254). Upserts its own parcels from the
      # county GIS, so it doesn't depend on enrich_assessor; runs after the
      # probate docket step so its probate cross-reference sees today's dockets.
      # ~9 requests, ~45 s; prints counts only.
      - name: Scrape estate-owned parcels (county GIS owner records)
        working-directory: scraper
        env:
          ESTATE_MAX_PAGES: "40"
        run: python estate_parcels.py
        continue-on-error: true

      # Seven third-party posting sites, each mirroring a different law firm's
      # newspaper foreclosure notice (TN foreclosures require newspaper
      # publication, not a county filing, so no single site is a master
      # list — see the module docstring). Deliberately additive: one site
      # failing doesn't block the others.
      - name: Scrape foreclosure notices (posting sites)
        working-directory: scraper
        run: python foreclosure_notices.py
        continue-on-error: true
        timeout-minutes: 30

      # edockets.us answers US IPs only, so this step is the only place it can
      # be exercised — it can't be run from the dev machine's connection.
      - name: Scrape General Sessions dockets
        working-directory: scraper
        run: python sessions_dockets.py
        continue-on-error: true

      # Resolves addresses/points/owner names to parcels and backfills
      # lat/long + owner data from the county GIS. Runs after every source so
      # it sees the day's new rows, and before the quality check and export —
      # the dashboard map has nothing to plot without it.
      - name: Enrich parcels via county GIS
        working-directory: scraper
        env:
          ENRICH_MAX_PARCELS: "20000"
          ENRICH_MAX_ADDRESSES: "3000"
          ENRICH_MAX_POINTS: "5000"
          ENRICH_MAX_OWNER_LOOKUPS: "500"
        run: python enrich_assessor.py
        continue-on-error: true

      # City of Chattanooga tax portal (OpenGov): per-parcel municipal-lien
      # lookups for parcels ALREADY flagged by another source — enrichment
      # only, never a crawl. Reads parcels.tax_map_no, so it must run after
      # enrich_assessor. >=1.6 s between requests; caps keep it under ~10 min.
      - name: Enrich municipal liens (City tax portal)
        working-directory: scraper
        timeout-minutes: 15
        env:
          LIENS_MAX_PARCELS: "100"
          LIENS_MAX_SECONDS: "540"
          LIENS_MAX_YEARS_PER_PARCEL: "8"
        run: python municipal_liens.py
        continue-on-error: true

      - name: Quality check (fails the build before anything commits)
        working-directory: scraper
        run: python quality_check.py

      - name: Build unified leads + dashboard exports
        working-directory: scraper
        run: python build_unified.py

      - name: Commit and push if changed
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Only the database is committed. dashboard/*.json is generated by
          # build_unified.py above and published straight to Pages below — it
          # is NOT stored in git (it was 80 MB of the ~110 MB rewritten every
          # day, which is what made .git grow ~15-20 MB/day).
          git add data/chattanooga.db
          if git diff --staged --quiet; then
            exit 0
          fi
          git commit -m "Automated scrape $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # A manual dispatch (or the daily job overlapping a manual one) can
          # race an unrelated push to master — e.g. a source-code commit
          # landing while this run's scrapers were still working. Since this
          # step only ever touches data/chattanooga.db,
          # rebasing onto whatever else landed is always safe (no other job
          # touches those paths), so retry a few times before giving up.
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push rejected (attempt $attempt) — fetching and rebasing"
            git fetch origin master
            git rebase origin/master
          done
          echo "::error::git push failed after 5 rebase-and-retry attempts"
          exit 1

      # Publish the freshly generated dashboard (index.html + the JSON that
      # build_unified.py just wrote). Uploaded BEFORE the skip-trace steps (they never write dashboard/), so
      # a skip-trace failure can never block the deploy. Runs every run: scores shift
      # daily with the time-decay "as of" date even when no source changed.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dashboard/

      # DealMachine skip trace of the top new leads. Runs after the daily
      # commit so ranking uses today's enriched data, and after the Pages
      # artifact upload above, so a skip-trace failure can never block the
      # day's data or the deploy. Off until the repo variable
      # SKIPTRACE_ENABLED is 'true' (set it after the dev_skiptrace.yml test
      # run confirms the APN format). Contacts go ONLY into the encrypted
      # data/contacts.db.enc; this public log shows counts and credits only.
      - name: Remove stale plaintext contact files
        if: vars.SKIPTRACE_ENABLED == 'true'
        run: rm -f data/contacts.db data/contacts.db-* data/contacts.db.enc.tmp

      - name: Skip trace top leads (DealMachine — counts-only log)
        if: vars.SKIPTRACE_ENABLED == 'true'
        working-directory: scraper
        env:
          DEALMACHINE_API_KEY: ${{ secrets.DEALMACHINE_API_KEY }}
          CONTACTS_KEY: ${{ secrets.CONTACTS_KEY }}
          SKIPTRACE_MAX_PER_RUN: "25"
          SKIPTRACE_MAX_CREDITS_PER_RUN: "100"
          SKIPTRACE_MAX_CREDITS_PER_DAY: "150"
          SKIPTRACE_BATCH_SIZE: "5"
          SKIPTRACE_MIN_REMAINING_CREDITS: "500"
          SKIPTRACE_REFRESH_DAYS: "180"
        run: python skip_trace.py
        continue-on-error: true
        timeout-minutes: 20

      # continue-on-error: a failure here (plaintext guard, push race, binary
      # rebase conflict) still shows red on the step but cannot fail the job -
      # the Pages artifact was already uploaded above, so deploy always runs.
      - name: Commit encrypted contact store
        if: vars.SKIPTRACE_ENABLED == 'true'
        continue-on-error: true
        run: |
          if ls data/contacts.db data/contacts.db-* data/contacts.db.enc.tmp 2>/dev/null | grep -q .; then
            echo "::error::plaintext contact store present"
            rm -f data/contacts.db data/contacts.db-* data/contacts.db.enc.tmp
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Stage each path on its own: one missing pathspec makes `git add` stage nothing.
          git add data/chattanooga.db || true
          if [ -f data/contacts.db.enc ]; then git add data/contacts.db.enc; fi
          if git diff --staged --quiet; then exit 0; fi
          git commit -m "Automated skip trace $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # Both files above are staged and now committed, so the tree is clean
          # for the rebase below (a dirty tree would abort every retry).
          for attempt in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $attempt) — fetching and rebasing"
            git fetch origin master
            # data/contacts.db.enc is a randomized Fernet blob: git cannot merge two
            # versions, and re-merging needs the plaintext, which is gone. The shared
            # concurrency group makes this unreachable; if it happens anyway, stop
            # loudly instead of letting a rebase pick a side and lose contacts.
            base=$(git merge-base HEAD origin/master)
            if ! git diff --quiet "$base" origin/master -- data/contacts.db.enc; then
              echo "::error::data/contacts.db.enc changed upstream since this run started - cannot merge encrypted stores; this run's contacts are NOT pushed (re-run skip trace after resolving)"
              exit 1
            fi
            if ! git rebase origin/master; then
              git rebase --abort || true
              echo "::error::rebase conflict (not on data/contacts.db.enc) - aborted"
              exit 1
            fi
          done
          echo "::error::git push failed after 5 rebase-and-retry attempts"
          exit 1

  deploy:
    needs: scrape
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6

      - id: deployment
        uses: actions/deploy-pages@v5
