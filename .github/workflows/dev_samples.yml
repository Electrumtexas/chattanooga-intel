# Manual dev helper: edockets.us only answers US IPs, so parser development
# pulls a few current General Sessions docket PDFs through a runner. The
# artifact expires after 1 day and is deleted as soon as it's downloaded.
name: dev-samples

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  samples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch docket list and sample PDFs
        shell: python
        run: |
          import json, re, time, pathlib, requests
          out = pathlib.Path("samples"); out.mkdir()
          s = requests.Session(); s.headers["User-Agent"] = "Mozilla/5.0 (chattanooga-intel dev)"
          # The docket page sets the session cookie the list call depends on; keep its
          # HTML and scripts too so the parser author can see the exact request the page makes.
          page = s.get("https://www.edockets.us/hamiltontn/", timeout=60)
          (out / "page.html").write_text(page.text)
          print("page", page.status_code, len(page.text), "cookies:", list(s.cookies.keys()))
          for src in set(re.findall(r'<script[^>]+src="([^"]+)"', page.text, flags=re.I)):
              url = requests.compat.urljoin(page.url, src)
              js = s.get(url, timeout=60)
              print("script", url, js.status_code, len(js.text))
              if js.ok:
                  (out / ("js_" + re.sub(r"[^A-Za-z0-9._-]", "_", src)[-80:])).write_text(js.text)
          # Try the request the way the page's own XHR sends it (raw text/plain body,
          # WEBIOHANDLE = epoch ms + day of month) as well as form-encoded.
          now = time.localtime()
          handle = str(int(time.time() * 1000) + now.tm_mday)
          params = [("GATEWAY", "GATEWAY"), ("XGATEWAY", "DocketGetInfo"), ("CGISCRIPT", "webshell.asp"),
                    ("XEVENT", "VERIFY"), ("WEBIOHANDLE", handle), ("MYPARENT", "px"), ("APPID", "ham"),
                    ("WEBWORDSKEY", "SAMPLE"), ("DEVPATH", "/INNOVISION/HAMILTON/HAMMAIN.DATA"),
                    ("OPERCODE", "dummy"), ("PASSWD", "dummy")]
          raw = "&".join(f"{k}={v}" for k, v in params)
          hdrs = {"Referer": "https://www.edockets.us/hamiltontn/", "Origin": "https://www.edockets.us",
                  "X-Requested-With": "XMLHttpRequest"}
          url = "https://www.edockets.us/cgi-bin/webshell.asp"
          variants = {
              "form": dict(data=dict(params)),
              "form_referer": dict(data=dict(params), headers=hdrs),
              "text_plain_referer": dict(data=raw.encode(), headers={**hdrs, "Content-Type": "text/plain;charset=UTF-8"}),
          }
          r = None
          for name, kw in variants.items():
              resp = s.post(url, timeout=60, **kw)
              print("variant", name, resp.status_code, len(resp.text), resp.headers.get("Content-Type"))
              if r is None or len(resp.text) > len(r.text):
                  r = resp
          (out / "docket_list_raw.txt").write_text(r.text)
          print("list", r.status_code, len(r.text))
          rows = re.findall(r'\[("[^\]]*")\]', r.text)
          entries = [json.loads("[" + row + "]") for row in rows]
          # Dates, courtrooms, docket types and file names only; no party data is printed.
          for e in entries:
              print(e)
          # Paths the list returned on 2026-09-15; older PDFs may stay on the server after
          # they drop off the upcoming-dockets list, which is useful for format samples.
          known = ["dockets/ses.214395161096.133696.pdf", "dockets/ses.2143951603444.133694.pdf",
                   "dockets/ses.214395161784.133698.pdf", "dockets/ses.21437271477.131808.pdf",
                   "dockets/ses.2143727134359.131804.pdf", "dockets/ses.2143727193630.131816.pdf"]
          types = ["Detainer", "Detainer", "Appearance", "Trial", "Trial", "Trial"]
          for path, dtype in zip(known, types):
              entries.append(["0915", "", "", "", dtype + "_known", path])
          by_type = {}
          for e in entries:
              if len(e) >= 6 and e[5].lower().endswith(".pdf"):
                  by_type.setdefault(e[4], []).append(e)
          for dtype, items in by_type.items():
              for e in items[:2]:
                  for base in ("https://www.edockets.us/hamiltontn/", "https://www.edockets.us/"):
                      pr = s.get(base + e[5], timeout=60)
                      ok = pr.ok and pr.content[:4] == b"%PDF"
                      print(dtype, e[0], base + e[5], pr.status_code, "pdf" if ok else "not-pdf")
                      if ok:
                          name = re.sub(r"[^A-Za-z0-9._-]", "_", f"{dtype}_{e[0]}_{pathlib.Path(e[5]).name}")
                          (out / name).write_bytes(pr.content)
                          break
      - uses: actions/upload-artifact@v4
        with:
          name: docket-samples
          path: samples/
          retention-days: 1
